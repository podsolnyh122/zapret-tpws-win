<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 14px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      user-select: none;
    }
    .header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }
    .status {
      font-size: 12px;
      margin-bottom: 14px;
      text-align: center;
      color: #888;
    }
    .status.active {
      color: #4caf50;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-enable {
      background-color: #2e7d32;
      color: white;
    }
    .btn-enable:hover {
      background-color: #388e3c;
    }
    .btn-disable {
      background-color: #c62828;
      color: white;
    }
    .btn-disable:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="header">TPWS SOCKS5</div>
  <div id="status" class="status">Отключено</div>
  <button id="toggleBtn" class="btn-enable">Включить</button>

  <script src="popup.js"></script>
</body>
</html>
